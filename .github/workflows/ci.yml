name: Public release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate synthetic manifest
        run: python src/validate_manifest.py examples/manifest.example.json
      - name: Audit public tree
        run: python src/audit_public_release.py .
      - name: Compile utilities
        run: python -m py_compile src/validate_manifest.py src/audit_public_release.py

