<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
  <title id="title">Halpe-26 body keypoint schematic</title>
  <desc id="desc">Original schematic of the 26 body keypoints used by the Body with feet Sports2D model, with a lower-limb subset highlighted.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102840"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#67d7ed"/>
      <stop offset="1" stop-color="#9ee6bc"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
