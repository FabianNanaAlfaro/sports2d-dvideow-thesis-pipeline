    <text x="60" y="94" fill="#67d7ed" font-size="10" font-weight="700" letter-spacing="1">S00</text>
    <text x="60" y="112" fill="#edf5ff" font-size="13" font-weight="700">Question + ethics</text>

    <rect x="216" y="70" width="145" height="57" rx="15" fill="#16304b" stroke="#67d7ed"/>
    <text x="234" y="94" fill="#67d7ed" font-size="10" font-weight="700" letter-spacing="1">S01</text>
