    <text x="495" y="387" fill="#67d7ed" font-size="10" font-weight="700">S06</text>
    <text x="495" y="406" fill="#edf5ff" font-size="13" font-weight="700">Biomechanics</text>

    <rect x="182" y="474" width="178" height="57" rx="15" fill="#17352f" stroke="#9ee6bc"/>
