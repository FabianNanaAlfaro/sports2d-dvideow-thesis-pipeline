<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Sports2D DVIDEOW thesis pipeline overview</title>
  <desc id="desc">A research question flows through an integrity map and synchronized views, branches into four 2D routes, and returns through homologation, DLT, temporal analysis, validation and public release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102840"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#67d7ed"/>
      <stop offset="1" stop-color="#9ee6bc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67d7ed"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="28" fill="url(#bg)"/>
  <g opacity=".35" fill="none" stroke="#67d7ed" stroke-width="1">
    <path d="M30 80H730M30 160H730M30 240H730M30 320H730M30 400H730M30 480H730" stroke-dasharray="2 13"/>
    <path d="M90 30V530M210 30V530M330 30V530M450 30V530M570 30V530M690 30V530" stroke-dasharray="2 13"/>
  </g>
